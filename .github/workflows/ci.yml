name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ZIG_VERSION: 0.16.0-xtensa
  QEMU_RELEASE: esp-develop-9.2.2-20250817
  QEMU_BUILD: esp_develop_9.2.2_20250817

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_asset: zig-relsafe-x86_64-linux-musl-baseline.tar.xz
            zig_dir: zig-relsafe-x86_64-linux-musl-baseline
            qemu_asset: qemu-xtensa-softmmu-esp_develop_9.2.2_20250817-x86_64-linux-gnu.tar.xz
            run_qemu: true
          - os: macos-latest
            zig_asset: zig-relsafe-aarch64-macos-baseline.tar.xz
            zig_dir: zig-relsafe-aarch64-macos-baseline
            qemu_asset: qemu-xtensa-softmmu-esp_develop_9.2.2_20250817-aarch64-apple-darwin.tar.xz
            run_qemu: true
          - os: windows-latest
            zig_asset: zig-relsafe-x86_64-windows-baseline.zip
            zig_dir: zig-relsafe-x86_64-windows-baseline
            qemu_asset: qemu-xtensa-softmmu-esp_develop_9.2.2_20250817-x86_64-w64-mingw32.tar.xz
            run_qemu: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup zig-espressif-bootstrap (${{ env.ZIG_VERSION }}) — Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$HOME/.local/zig"
          curl --fail -L -o /tmp/zig.tar.xz \
            "https://github.com/kassane/zig-espressif-bootstrap/releases/download/${ZIG_VERSION}/${{ matrix.zig_asset }}"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig"
          echo "$HOME/.local/zig/${{ matrix.zig_dir }}" >> "$GITHUB_PATH"
          rm /tmp/zig.tar.xz

      - name: Setup zig-espressif-bootstrap (${{ env.ZIG_VERSION }}) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.local\zig" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/kassane/zig-espressif-bootstrap/releases/download/$env:ZIG_VERSION/${{ matrix.zig_asset }}" -OutFile "$env:TEMP\zig.zip"
          Expand-Archive -Path "$env:TEMP\zig.zip" -DestinationPath "$HOME\.local\zig" -Force
          "$HOME\.local\zig\${{ matrix.zig_dir }}" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build firmware for ESP32 + ESP32-S2 + ESP32-S3 (Debug)
        run: zig build --summary all

      - name: Build firmware for ESP32 + ESP32-S2 + ESP32-S3 (ReleaseSmall)
        run: zig build --summary all -Doptimize=ReleaseSmall

      - name: Install QEMU runtime libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libslirp0

      - name: Install QEMU runtime libs (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 libslirp

      - name: Setup Espressif QEMU (xtensa) — Unix
        if: matrix.run_qemu && runner.os != 'Windows'
        run: |
          QEMU_DIR="$HOME/.espressif/tools/qemu-xtensa/${QEMU_BUILD}"
          mkdir -p "$QEMU_DIR"
          curl --fail -L -o /tmp/qemu.tar.xz \
            "https://github.com/espressif/qemu/releases/download/${QEMU_RELEASE}/${{ matrix.qemu_asset }}"
          tar -xJf /tmp/qemu.tar.xz -C "$QEMU_DIR"
          [ "$RUNNER_OS" = "macOS" ] && xattr -dr com.apple.quarantine "$QEMU_DIR" || true
          echo "$QEMU_DIR/qemu/bin" >> "$GITHUB_PATH"
          rm /tmp/qemu.tar.xz

      - name: Setup Espressif QEMU (xtensa) — Windows
        if: matrix.run_qemu && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$HOME\.espressif\tools\qemu-xtensa\$env:QEMU_BUILD"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/espressif/qemu/releases/download/$env:QEMU_RELEASE/${{ matrix.qemu_asset }}" -OutFile "$env:TEMP\qemu.tar.xz"
          # The mingw build is statically linked (no bundled DLLs); 7z reliably
          # handles the .xz → .tar → files extraction on the runner image.
          7z x "$env:TEMP\qemu.tar.xz" -o"$env:TEMP" -y | Out-Null
          7z x "$env:TEMP\qemu.tar" -o"$dir" -y | Out-Null
          "$dir\qemu\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Boot-test firmware in QEMU (ESP32 + ESP32-S3)
        if: matrix.run_qemu
        run: zig build smoke --summary all

      # Each example is a standalone package (depends on the repo root locally);
      # run them on their own and print each one's output. `shell: bash` so the
      # `cd … && …` works the same on Windows (Git Bash) as on Unix.
      - name: ESP32 example — FFT spectrum + std.log over UART
        if: matrix.run_qemu
        shell: bash
        run: cd esp32 && zig build demo

      - name: ESP32-S3 example — PIE/SIMD blink (boots, no UART by design)
        if: matrix.run_qemu
        shell: bash
        run: cd esp32s3 && zig build demo

      - name: ESP32-S2 example — build-only (no Espressif QEMU machine)
        if: matrix.run_qemu
        shell: bash
        run: cd esp32s2 && zig build --summary all
